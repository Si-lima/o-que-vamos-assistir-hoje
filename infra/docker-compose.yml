services:
  postgres:
    image: postgres:16
    container_name: oqvah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oqvah_db
      POSTGRES_USER: oqvah_user
      POSTGRES_PASSWORD: oqvah_password
    ports:
      - "5432:5432"
    volumes:
      - oqvah_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oqvah_user -d oqvah_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oqvah_postgres_data:
